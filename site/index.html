<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="浏览 PromptDirector 人工审核的图片与视频创作包。">
    <title>PromptDirector 精选案例</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>精选案例</h1>
      <label class="search-shell">
        <span class="visually-hidden">搜索创作包或包内案例</span>
        <span class="search-mark" aria-hidden="true"></span>
        <input id="search-input" type="search" placeholder="搜索创作包或包内案例" autocomplete="off">
      </label>
      <div class="header-actions">
        <a class="support-link" href="support.html">支持</a>
        <a class="privacy-link" href="privacy.html">隐私</a>
        <div class="filter-wrap">
          <button id="filter-button" class="button-secondary" type="button" aria-expanded="false">筛选<span id="filter-count"></span></button>
          <div id="filter-popover" class="menu-panel filter-panel" hidden>
            <strong>内容类型</strong>
            <label><input type="checkbox" value="image_prompt">图片案例</label>
            <label><input type="checkbox" value="video_prompt">视频案例</label>
            <label><input id="followed-filter" type="checkbox" value="followed">已关注</label>
            <button id="clear-filters" class="menu-reset" type="button">清除筛选</button>
          </div>
        </div>
        <details id="sort-menu" class="sort-menu">
          <summary class="button-secondary"><span id="sort-label">推荐</span><span class="chevron" aria-hidden="true"></span></summary>
          <div class="menu-panel sort-panel">
            <button type="button" data-sort="recommended" aria-current="true">推荐<span class="sort-check">✓</span></button>
            <button type="button" data-sort="latest" aria-current="false">最新<span class="sort-check">✓</span></button>
            <button id="sort-downloads" type="button" data-sort="downloads" aria-current="false" disabled>下载<span class="sort-check">✓</span></button>
          </div>
        </details>
      </div>
    </header>

    <aside class="product-guide" aria-label="PromptDirector 安装与源码">
      <p><strong>把精选案例带回自己的资料库</strong><span>安装 PromptDirector 后，可导入、整理并继续创作。</span></p>
      <div class="product-actions">
        <a class="install-link" href="https://chromewebstore.google.com/detail/iahakaahijddcjjldidbclicedibgpjm" target="_blank" rel="noopener noreferrer">安装到 Chrome</a>
        <a class="source-link" href="https://github.com/wchao6891/PromptDirector" target="_blank" rel="noopener noreferrer">查看源码</a>
      </div>
    </aside>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-grid" aria-label="正在加载精选案例">
        <span></span><span></span><span></span><span></span>
      </section>
    </main>

    <dialog id="detail-dialog" class="detail-dialog" aria-label="精选案例详情">
      <button id="detail-close" class="dialog-close" type="button" aria-label="关闭详情">×</button>
      <div id="detail-content"></div>
      <div id="case-detail-backdrop" class="case-detail-backdrop" hidden></div>
      <aside id="case-detail-drawer" class="case-detail-drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="案例详情">
        <nav class="case-detail-toolbar" aria-label="案例切换">
          <button id="case-detail-prev" type="button" aria-label="上一个案例">‹</button>
          <button id="case-detail-next" type="button" aria-label="下一个案例">›</button>
          <button id="case-detail-close" type="button" aria-label="关闭案例详情">×</button>
        </nav>
        <div id="case-detail-content" class="case-detail-content"></div>
      </aside>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
