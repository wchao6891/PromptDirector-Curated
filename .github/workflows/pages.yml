name: Publish curated catalog

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/curated-site-data.mjs"
      - "tools/validate-catalog.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate catalog
        run: node tools/validate-catalog.mjs && node tools/validate-skill-catalog.mjs
      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
