name: Website build and compatibility
on:
  pull_request:
  push:
    branches: [main]
    paths: ["package*.json", "web/**", "site/**", "tools/**", "test/website.test.mjs", "test/video-worker.test.mjs", ".github/workflows/website-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/validate-catalog.mjs && node tools/validate-skill-catalog.mjs
      - run: node tools/build-website.mjs
      - run: npm test
