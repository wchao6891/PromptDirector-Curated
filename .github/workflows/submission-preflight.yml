name: 精选投稿预检

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 投稿 Issue 编号
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-preflight-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[投稿]') || contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 保存投稿内容
        id: submission
        env:
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const value = String(context.payload.issue?.number || process.env.MANUAL_ISSUE_NUMBER || '');
            if (!/^[1-9][0-9]*$/.test(value) || !Number.isSafeInteger(Number(value))) throw new Error('投稿编号无效');
            const issue_number = Number(value);
            const issue = context.payload.issue || (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number })).data;
            if (!issue.title.startsWith('[投稿]') && !issue.labels.some(label => label.name === 'submission')) throw new Error('这不是案例投稿');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/issue-body.md`, issue.body || '');
            core.setOutput('issue_number', String(issue_number));

      - name: 准备媒体检查工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffprobe -version

      - name: 预检投稿包
        id: preflight
        continue-on-error: true
        run: >-
          node tools/submission-preflight.mjs
          --issue-body "$RUNNER_TEMP/issue-body.md"
          --report "$RUNNER_TEMP/preflight-report.json"
          --payload "$RUNNER_TEMP/review-payload.zip"

      - name: 保存审核证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-preflight-${{ steps.submission.outputs.issue_number }}
          path: |
            ${{ runner.temp }}/preflight-report.json
            ${{ runner.temp }}/review-payload.zip
          if-no-files-found: warn
          retention-days: 30

      - name: 更新预检状态
        if: always() && steps.submission.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OK: ${{ steps.preflight.outcome == 'success' }}
          REPORT_PATH: ${{ runner.temp }}/preflight-report.json
          ISSUE_NUMBER: ${{ steps.submission.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- promptdirector-submission-preflight -->';
            let report = { ok: false, errorType: 'system', message: '预检没有生成结果，请查看运行日志。' };
            if (fs.existsSync(process.env.REPORT_PATH)) {
              report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            }
            const passed = process.env.PREFLIGHT_OK === 'true' && report.ok === true;
            const systemError = report.errorType === 'system';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            for (const name of ['preflight-passed', 'needs-fix', 'preflight-error']) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name,
                  color: name === 'preflight-passed' ? '2da44e' : name === 'preflight-error' ? 'bf8700' : 'd73a4a'
                });
              }
            }
            const add = passed ? 'preflight-passed' : systemError ? 'preflight-error' : 'needs-fix';
            const remove = ['preflight-passed', 'needs-fix', 'preflight-error'].filter((name) => name !== add);
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [add] });
            for (const name of remove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const body = passed
              ? `${marker}\n预检通过：${report.caseCount} 个案例、${report.mediaCount} 个媒体。仍需人工审核后才会发布。`
              : systemError
                ? `${marker}\n预检系统暂不可用：${report.message || '审核环境异常'}\n\n投稿文件无需重新上传，维护者修复后会重新检查。`
                : `${marker}\n预检未通过：${report.message || '投稿包无法安全读取'}\n\n请在 PromptDirector 重新生成全部投稿文件后替换附件。`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.filter((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous.length) {
              for (const comment of previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
