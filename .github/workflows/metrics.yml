name: Refresh public download metrics

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curated-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read verified Release metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-release-metrics.mjs site/catalog.json site/metrics.json
      - name: Validate public data
        run: node tools/validate-catalog.mjs
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- site/metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/metrics.json
          git commit -m "Refresh verified Release download metrics"
          git push
