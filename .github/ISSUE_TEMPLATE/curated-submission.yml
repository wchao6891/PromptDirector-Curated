name: 精选案例投稿
description: 提交由 PromptDirector 生成的精选投稿包，等待人工审核。
title: "[投稿] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        上传 PromptDirector 生成的全部投稿 ZIP。投稿不会自动发布，维护者会人工检查质量、重复内容、隐私和授权。
  - type: input
    id: author
    attributes:
      label: 公开署名
      description: 发布时显示的作者或团队名称。
    validations:
      required: true
  - type: dropdown
    id: rights_basis
    attributes:
      label: 内容权利情况
      description: 第三方公开案例只能推荐收录，不能由投稿者替原作者授予 CC 许可。
      options:
        - 第三方公开案例推荐（不声明授权，权利归原作者）
        - 本人原创（CC BY 4.0）
        - 本人原创（CC BY-SA 4.0）
        - 本人原创（CC0 1.0）
        - 已获权利人明确授权（请在说明中写明范围）
        - 其他权利情况（请在说明中写明）
    validations:
      required: true
  - type: upload
    id: package
    attributes:
      label: 投稿包
      description: 选择 PromptDirector 生成的一个 ZIP，或一次选择全部分卷 ZIP。
    validations:
      required: true
      accept: ".zip"
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 可选。说明案例价值、适用模型或需要人工注意的授权信息。
  - type: checkboxes
    id: rights
    attributes:
      label: 权利与公开范围确认
      options:
        - label: 如为本人原创或已获授权，我确认所选许可有效；如为第三方推荐，我不代表原作者授予许可。
          required: true
        - label: 我已保留可核验的原作者与来源，并理解权利人提出要求时需要下架。
          required: true
        - label: 我已检查投稿包，不包含私人网址、身份信息、密钥、草稿或无权公开的素材。
          required: true
        - label: 我理解投稿需要人工审核，提交不代表一定入选。
          required: true
